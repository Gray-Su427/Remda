appId: com.remda.app
productName: Remda
directories:
  output: release
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: Remda-${version}-${arch}.${ext}
nsis:
  artifactName: Remda-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
